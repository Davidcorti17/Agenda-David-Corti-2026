<div class="pagina">
  <header class="cabecera">
    <h1 class="titulo">Contactos</h1>
    <a routerLink="/contactos/nuevo" class="agregar">Agregar contacto</a>
  </header>

  <ul class="grilla">
    @for (contacto of servicio.contactos(); track contacto.id) {
      <li class="tarjeta">
        <a class="tarjeta-boton" [routerLink]="['/contactos', contacto.id]">
          <p class="nombre">{{ contacto.nombre || 'Nombre' }}</p>
          <p class="previa">{{ contacto.celular || contacto.email || 'Sin datos' }}</p>
        </a>
      </li>
    }
  </ul>
</div>
