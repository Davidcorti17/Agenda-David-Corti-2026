<div class="pagina">
  <header class="cabecera">
    <h1 class="titulo">{{ esEdicion() ? 'Editar contacto' : 'Nuevo contacto' }}</h1>
  </header>

  <form class="formulario" (submit)="$event.preventDefault(); guardar()">
    <div class="campo">
      <label for="firstName">Nombre</label>
      <input id="firstName" type="text" [formField]="contactoForm.firstName" />
    </div>

    <div class="campo">
      <label for="lastName">Apellido</label>
      <input id="lastName" type="text" [formField]="contactoForm.lastName" />
    </div>

    <div class="campo">
      <label for="company">Empresa</label>
      <input id="company" type="text" [formField]="contactoForm.company" />
    </div>

    <div class="campo">
      <label for="number">Teléfono</label>
      <input id="number" type="tel" [formField]="contactoForm.number" />
    </div>

    <div class="campo">
      <label for="email">Email</label>
      <input id="email" type="email" [formField]="contactoForm.email" />
    </div>

    <div class="campo">
      <label for="address">Dirección</label>
      <input id="address" type="text" [formField]="contactoForm.address" />
    </div>

    <div class="campo">
      <label for="image">Imagen</label>
      <input id="image" type="url" [formField]="contactoForm.image" />
    </div>

    <div class="campo">
      <label for="description">Descripción</label>
      <textarea id="description" rows="3" [formField]="contactoForm.description"></textarea>
    </div>

    <div class="acciones">
      <button type="submit" class="agregar">Guardar</button>
    </div>
  </form>
</div>
